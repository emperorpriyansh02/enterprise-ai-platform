# Local stack. Later layers add: redis (cache).
#   docker compose up --build                 # postgres + keycloak + backend + frontend
#   docker compose --profile local up --build # + Ollama for local models
# Example prompts: docker compose exec backend python -m app.prompts.seed
# Sign in at http://localhost:3000 as alice / alice-dev (admin), bob / bob-dev (editor) or carol / carol-dev (user).
# AUTH_ENABLED=false docker compose up         # no sign-in: every request acts as a dev admin
services:
  postgres:
    # pgvector image so the RAG layer (Layer 3) can reuse this database.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: eap
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eap} # dev default; set a real one outside local dev
      POSTGRES_DB: eap
    ports:
      - "5432:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eap -d eap"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  keycloak:
    # OAuth / OIDC sign-in (Layer 5). Imports the `eap` realm (roles, web client, demo users) on first start.
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin} # dev default
      # Tokens say iss=http://localhost:8080/realms/eap (the address the browser uses);
      # the backend fetches signing keys over the Docker network (OIDC_JWKS_URL below).
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports:
      - "8080:8080"
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro
    restart: unless-stopped

  backend:
    build: ./backend
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://eap:${POSTGRES_PASSWORD:-eap}@postgres:5432/eap
      AUTH_ENABLED: ${AUTH_ENABLED:-true}
      OIDC_ISSUER: http://localhost:8080/realms/eap
      OIDC_JWKS_URL: http://keycloak:8080/realms/eap/protocol/openid-connect/certs
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # The browser calls the backend directly, so this is the host-facing URL.
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest # pin a specific version for production
    profiles: ["local"]
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped

volumes:
  postgres: {}
  ollama: {}
